<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#f5f6f7"
  >

  <title>ふくむろ時計</title>


  <!-- =====================================
       Google Fonts
       教科書体に近い明朝系
  ====================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&display=swap"
    rel="stylesheet"
  >


  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =====================================
       アプリ全体
  ====================================== -->

  <main class="app">


    <!-- ===================================
         左上：タイトル
    ==================================== -->

    <div class="app-title">
      ふくむろ時計
    </div>


    <!-- ===================================
         上中央：デジタル時計
    ==================================== -->

    <div
      id="digitalClock"
      class="digital-clock"
    >
      00:00:00
    </div>


    <!-- ===================================
         右上：A / B 切り替え
    ==================================== -->

    <div class="mode-switch">

      <button
        id="modeA"
        class="mode-button active"
        type="button"
      >
        Aタイム
      </button>

      <button
        id="modeB"
        class="mode-button"
        type="button"
      >
        Bタイム
      </button>

    </div>


    <!-- ===================================
         中央：アナログ時計
    ==================================== -->

    <div class="clock-wrapper">

      <div
        id="analogClock"
        class="clock"
      >

        <!-- 目盛り -->

        <div
          id="clockTicks"
          class="clock-ticks"
        ></div>


        <!-- 数字 -->

        <div
          id="clockNumbers"
          class="clock-numbers"
        ></div>


        <!-- 時針 -->

        <div
          id="hourHand"
          class="clock-hand hour-hand"
        ></div>


        <!-- 分針 -->

        <div
          id="minuteHand"
          class="clock-hand minute-hand"
        ></div>


        <!-- 秒針 -->

        <div
          id="secondHand"
          class="clock-hand second-hand"
        ></div>


        <!-- 中央 -->

        <div class="clock-center"></div>

      </div>

    </div>


    <!-- ===================================
         左下情報
    ==================================== -->

    <div class="bottom-left-info">


      <!-- 現在のタイム -->

      <div
        id="currentMode"
        class="current-mode"
      >
        Aタイム
      </div>


      <!-- 次のチャイム -->

      <div
        id="nextEvent"
        class="next-event"
      >
        次のチャイム：--
      </div>


      <!-- ステータス -->

      <div
        id="status"
        class="status"
      >
        準備中...
      </div>


    </div>


    <!-- ===================================
         右下：設定ボタン
    ==================================== -->

    <button
      id="settingsButton"
      class="settings-button"
      type="button"
      aria-label="設定"
      title="設定"
    >
      ⚙
    </button>


  </main>


  <!-- =====================================
       設定モーダル
  ====================================== -->

  <div
    id="settingsModal"
    class="modal"
  >

    <div class="modal-panel">


      <!-- ヘッダー -->

      <div class="modal-header">

        <h2>
          時報設定
        </h2>

        <button
          id="closeSettings"
          class="close-button"
          type="button"
          aria-label="閉じる"
        >
          ×
        </button>

      </div>


      <!-- =================================
           MP3テスト
      ================================== -->

      <section class="settings-section">

        <h3>
          MP3再生
        </h3>

        <p class="settings-description">
          ブラウザの自動再生制限を解除するため、
          最初に下のボタンでMP3を試聴してください。
        </p>

        <button
          id="testSoundButton"
          class="primary-button"
          type="button"
        >
          MP3を試聴
        </button>

      </section>


      <!-- =================================
           Aタイム
      ================================== -->

      <section class="settings-section">

        <h3>
          Aタイム
        </h3>

        <div class="table-wrapper">

          <table>

            <thead>

              <tr>
                <th>時刻</th>
                <th>メモ</th>
                <th>MP3</th>
              </tr>

            </thead>

            <tbody id="aTimeTable">

            </tbody>

          </table>

        </div>

      </section>


      <!-- =================================
           Bタイム
      ================================== -->

      <section class="settings-section">

        <h3>
          Bタイム
        </h3>

        <div class="table-wrapper">

          <table>

            <thead>

              <tr>
                <th>時刻</th>
                <th>メモ</th>
                <th>MP3</th>
              </tr>

            </thead>

            <tbody id="bTimeTable">

            </tbody>

          </table>

        </div>

      </section>


    </div>

  </div>


  <script src="script.js"></script>

</body>

</html>
