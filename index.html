<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>ふくむろ時計</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >

</head>


<body>

  <main class="app">


    <!-- =========================
         左上：タイトル
    ========================== -->

    <header class="app-title">
      ふくむろ時計
    </header>


    <!-- =========================
         上部：デジタル時計
    ========================== -->

    <div
      id="digitalClock"
      class="digital-clock"
    >
      00:00:00
    </div>


    <!-- =========================
         右上：A/B切り替え
    ========================== -->

    <div class="mode-switch">

      <button
        id="modeA"
        class="mode-button active"
        type="button"
      >
        Aタイム
      </button>

      <button
        id="modeB"
        class="mode-button"
        type="button"
      >
        Bタイム
      </button>

    </div>


    <!-- =========================
         中央：アナログ時計
    ========================== -->

    <section class="clock-wrapper">

      <div
        id="clock"
        class="clock"
        aria-label="アナログ時計"
      >

        <!-- 目盛り -->

        <div
          id="clockTicks"
          class="clock-ticks"
        ></div>


        <!-- 数字 -->

        <div
          id="clockNumbers"
          class="clock-numbers"
        ></div>


        <!-- 時針 -->

        <div
          id="hourHand"
          class="clock-hand hour-hand"
        ></div>


        <!-- 分針 -->

        <div
          id="minuteHand"
          class="clock-hand minute-hand"
        ></div>


        <!-- 秒針 -->

        <div
          id="secondHand"
          class="clock-hand second-hand"
        ></div>


        <!-- 中央 -->

        <div class="clock-center"></div>

      </div>

    </section>


    <!-- =========================
         左下：時報情報
    ========================== -->

    <div class="bottom-left-info">


      <!-- 現在のモード -->

      <div
        id="currentMode"
        class="current-mode"
      >
        Aタイム
      </div>


      <!-- 次の時報 -->

      <div
        id="nextEvent"
        class="next-event"
      >
        次の時報：--
      </div>


      <!-- ステータス -->

      <div
        id="status"
        class="status"
      >
        準備中...
      </div>


    </div>


    <!-- =========================
         右下：設定
    ========================== -->

    <button
      id="settingsButton"
      class="settings-button"
      type="button"
      aria-label="設定"
    >
      ⚙
    </button>


  </main>


  <!-- ==================================
       設定モーダル
  =================================== -->

  <div
    id="settingsModal"
    class="modal"
    aria-hidden="true"
  >

    <div class="modal-panel">


      <!-- モーダルヘッダー -->

      <div class="modal-header">

        <h2>
          設定
        </h2>

        <button
          id="closeSettings"
          class="close-button"
          type="button"
        >
          ×
        </button>

      </div>


      <!-- =========================
           音声テスト
      ========================== -->

      <section class="settings-section">

        <h3>
          MP3再生
        </h3>

        <p class="settings-description">
          ブラウザの音声再生を確認できます。
        </p>

        <button
          id="testAudioButton"
          class="primary-button"
          type="button"
        >
          ▶ MP3を試聴
        </button>

      </section>


      <!-- =========================
           時刻表
      ========================== -->

      <section class="settings-section">

        <h3>
          時刻表
        </h3>

        <div class="table-wrapper">

          <table>

            <thead>

              <tr>
                <th>Aタイム</th>
                <th>Bタイム</th>
                <th>メモ</th>
                <th>MP3</th>
              </tr>

            </thead>

            <tbody
              id="scheduleTable"
            ></tbody>

          </table>

        </div>

      </section>


      <!-- =========================
           操作説明
      ========================== -->

      <section class="settings-section">

        <h3>
          操作
        </h3>

        <p class="settings-description">
          AタイムまたはBタイムを選択すると、
          選択した時刻表に従ってMP3を再生します。
        </p>

        <p class="settings-description">
          初回アクセス時は、ブラウザによって
          音声再生の許可が必要になる場合があります。
        </p>

      </section>


    </div>

  </div>


  <!-- =========================
       音声
  ========================== -->

  <audio
    id="audioPlayer"
    preload="auto"
  ></audio>


  <script src="./script.js"></script>

</body>

</html>
